# Weekly Component Review Workflow
#
# This GitHub Actions workflow performs automated component reviews using Claude Code
# and creates GitHub issues for findings.
#
# Schedule: Every Monday at 10:00 AM UTC
# Manual trigger: Available via workflow_dispatch

name: Weekly Component Review

on:
  schedule:
    # Run every Monday at 10:00 AM UTC
    - cron: '0 10 * * 1'

  workflow_dispatch:
    # Manual trigger with optional parameters
    inputs:
      component_count:
        description: 'Number of components to review'
        required: false
        default: '3'
      target_component:
        description: 'Target specific component (optional, e.g., "agents", "core_infrastructure")'
        required: false
        default: ''
      review_types:
        description: 'Comma-separated review types (optional, e.g., "security,tech_debt")'
        required: false
        default: ''

permissions:
  contents: write # For creating branches and commits
  issues: write # For creating issues
  pull-requests: write # For creating PRs

jobs:
  component-review:
    name: Review Components
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for better analysis

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Setup Claude Code
        uses: anthropics/claude-code-ci@v1
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Run Component Review
        id: review
        uses: anthropics/claude-code-ci@v1
        with:
          prompt: |
            Use the component-reviewer Skill to perform automated component review.

            Configuration:
            - Component count: ${{ github.event.inputs.component_count || '3' }}
            - Target component: ${{ github.event.inputs.target_component || 'random selection' }}
            - Review types: ${{ github.event.inputs.review_types || 'all applicable' }}

            Instructions:
            1. Select components using the weighted random algorithm (or target specific component if provided)
            2. Identify applicable review types for each component
            3. Delegate to appropriate review agents (3 core + dynamic agents)
            4. Synthesize findings from all agents
            5. Create GitHub issues for all findings:
               - Critical: Create issue with 'auto-fix' label
               - High: Create issue with 'priority:high' label
               - Medium: Batch into tech debt issue
               - Low: Add to quarterly backlog

            For critical issues:
            - Trigger auto-fix workflow by creating issue with label 'auto-fix'
            - Include detailed fix recommendations
            - Link to evidence and reproduction steps

            Generate summary report with:
            - Components reviewed
            - Agents used
            - Total findings by severity
            - Issues created (with links)
            - Key recommendations

      - name: Post Review Summary
        if: always()
        run: |
          echo "## Component Review Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Review Date**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See issues created: https://github.com/${{ github.repository }}/issues" >> $GITHUB_STEP_SUMMARY

      - name: Upload Review Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: component-review-report-${{ github.run_number }}
          path: |
            docs/04-guides/component-review-*.md
            .claude/debug/review-*.json
          retention-days: 90

  # Auto-fix job for critical issues
  auto-fix:
    name: Auto-Fix Critical Issues
    runs-on: ubuntu-latest
    needs: component-review
    if: ${{ needs.component-review.result == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Sync dependencies
        run: uv sync

      - name: Find Critical Issues with auto-fix Label
        id: find-issues
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'auto-fix',
              state: 'open',
              per_page: 10
            });

            // Filter issues created in last 10 minutes (from this workflow)
            const recentIssues = issues.data.filter(issue => {
              const createdAt = new Date(issue.created_at);
              const tenMinutesAgo = new Date(Date.now() - 10 * 60 * 1000);
              return createdAt > tenMinutesAgo;
            });

            console.log(`Found ${recentIssues.length} critical issues to auto-fix`);
            core.setOutput('issue-numbers', recentIssues.map(i => i.number).join(','));
            return recentIssues.length > 0;

      - name: Auto-Fix Issues
        if: steps.find-issues.outputs.issue-numbers != ''
        uses: anthropics/claude-code-ci@v1
        with:
          prompt: |
            Auto-fix critical issues found in component review.

            Issue numbers: ${{ steps.find-issues.outputs.issue-numbers }}

            For each issue:
            1. Read issue details (component, finding, recommendation)
            2. Analyze current code in component
            3. Apply fix following recommendation
            4. Run validation:
               - uv run ruff check --fix
               - uv run ruff format
               - uv run pytest (affected tests)
               - uv run mypy (if type-related)
            5. If all validation passes:
               - Create feature branch: fix/issue-{number}-{brief-desc}
               - Commit changes with message: "fix: {issue title} (fixes #{number})"
               - Create PR with:
                 * Link to issue
                 * Summary of changes
                 * Validation results
                 * Request human review
            6. If validation fails:
               - Add comment to issue with failure details
               - Label issue as 'auto-fix-failed'
               - Do NOT create PR

            Use source-control agent for commit automation.

      - name: Summary
        if: always()
        run: |
          echo "## Auto-Fix Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Issues Processed**: ${{ steps.find-issues.outputs.issue-numbers || 'None' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See PRs created: https://github.com/${{ github.repository }}/pulls" >> $GITHUB_STEP_SUMMARY

  # Notification job
  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [component-review, auto-fix]
    if: always()

    steps:
      - name: Prepare Summary
        id: summary
        run: |
          echo "review_status=${{ needs.component-review.result }}" >> $GITHUB_OUTPUT
          echo "autofix_status=${{ needs.auto-fix.result }}" >> $GITHUB_OUTPUT

      # Add your notification integration here (Slack, Discord, etc.)
      # Example for Slack:
