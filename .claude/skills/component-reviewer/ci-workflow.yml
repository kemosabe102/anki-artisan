      #               "type": "mrkdwn",
      #               "text": "*Weekly Component Review* - ${{ steps.summary.outputs.review_status }}\n*Auto-Fix* - ${{ steps.summary.outputs.autofix_status }}\n\nView details: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      #             }
